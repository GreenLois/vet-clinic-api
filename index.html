<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Ветклініка - Клієнт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Управління пацієнтами ветклініки</h1> 

    <div id="message"></div>

    <div class="section form-container">
        <h2>Додати нового пацієнта</h2>
        <form onsubmit="addPet(event)">
            <div class="form-group">
                <label>Кличка:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Вид:</label>
                <input type="text" id="species" required>
            </div>
            <div class="form-group">
                <label>Порода:</label>
                <input type="text" id="breed">
            </div>
            <div class="form-group">
                <label>Дата народження:</label>
                <input type="date" id="birth_date">
            </div>
            <div class="form-group">
                <label>Ім'я власника:</label>
                <input type="text" id="owner_name">
            </div>
            <button type="submit">Додати пацієнта</button>
        </form>
    </div>

    <div class="section">
        <h2>Список всіх пацієнтів</h2>
        <button onclick="loadPets()" class="info">Оновити дані</button>

        <table id="petsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Кличка</th>
                    <th>Вид</th>
                    <th>Порода</th>
                    <th>Дата народження</th>
                    <th>Власник</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        function showMessage(text, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = '';
            }, 4000);
        }

        function formatDate(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value.replace(/T.*Z$/, '');
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function findOwnerByName(firstName) {
            if (!firstName) return null;
            const response = await fetch(`/api/owners?first_name=${encodeURIComponent(firstName)}`);
            if (response.status === 404) return null;
            if (!response.ok) throw new Error('Помилка пошуку власника');
            const owner = await response.json();
            return owner.owner_id;
        }

        async function createOwner(firstName) {
            const lastName = prompt('Прізвище власника (необов’язково):', '');
            const phone = prompt('Телефон (необов’язково):', '');
            const email = prompt('Email (необов’язково):', '');
            const response = await fetch('/api/owners', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ first_name: firstName, last_name: lastName || null, phone: phone || null, email: email || null })
            });
            if (!response.ok) throw new Error('Не вдалося створити власника');
            const owner = await response.json();
            return owner.owner_id;
        }

        async function resolveOwnerId(ownerName) {
            if (!ownerName) return null;
            const ownerId = await findOwnerByName(ownerName);
            if (ownerId) return ownerId;
            const create = confirm(`Власника "${ownerName}" не знайдено. Створити нового власника?`);
            if (!create) return null;
            return await createOwner(ownerName);
        }

        async function loadPets() {
            try {
                const response = await fetch('/api/pets');
                if (!response.ok) throw new Error('Помилка завантаження даних');
                
                const pets = await response.json();
                const tbody = document.querySelector('#petsTable tbody');
                tbody.innerHTML = '';

                if (pets.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Немає пацієнтів</td></tr>';
                    return;
                }

                pets.forEach(pet => {
                    const row = `<tr>
                        <td>${pet.animal_id}</td>
                        <td>${pet.name}</td>
                        <td>${pet.species || '-'}</td>
                        <td>${pet.breed || '-'}</td>
                        <td>${formatDate(pet.birth_date)}</td>
                        <td>${pet.owner_name || '-'}</td>
                        <td class="actions">
                            <button class="info" onclick="editPet(${pet.animal_id})">Редагувати</button>
                            <button class="danger" onclick="deletePet(${pet.animal_id})">Видалити</button>
                        </td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
                showMessage('Дані завантажені успішно', 'success');
            } catch (error) {
                showMessage(`Помилка: ${error.message}`, 'error');
            }
        }

        async function addPet(event) {
            event.preventDefault();
            const name = document.getElementById('name').value.trim();
            const species = document.getElementById('species').value.trim();
            const breed = document.getElementById('breed').value.trim() || null;
            const birth_date = document.getElementById('birth_date').value || null;
            const owner_name = document.getElementById('owner_name').value.trim() || null;

            try {
                let owner_id = null;
                if (owner_name) {
                    owner_id = await resolveOwnerId(owner_name);
                    if (!owner_id) {
                        showMessage('Додавання скасовано. Власника не знайдено.', 'error');
                        return;
                    }
                }

                const response = await fetch('/api/pets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, species, breed, birth_date, owner_id, owner_name })
                });
                
                if (!response.ok) {
                    const body = await response.json().catch(() => null);
                    throw new Error(body?.error || 'Помилка при додаванні пацієнта');
                }
                
                showMessage('Пацієнт успішно додан!', 'success');
                document.querySelector('form').reset();
                loadPets();
            } catch (error) {
                showMessage(`Помилка: ${error.message}`, 'error');
            }
        }

        async function editPet(id) {
            try {
                // Отримуємо свіжі дані тварини
                const response = await fetch(`/api/pets/${id}`);
                if (!response.ok) throw new Error('Не вдалося отримати дані тварини');
                const pet = await response.json();

                // Запитуємо нові значення через prompt
                const newName = prompt('Кличка:', pet.name);
                if (newName === null) return; // Скасовано
                const newSpecies = prompt('Вид:', pet.species || '');
                if (newSpecies === null) return; // Скасовано

                // Створюємо повний об'єкт для оновлення
                const updatedPet = {
                    name: newName.trim(),
                    species: newSpecies.trim(),
                    breed: pet.breed,
                    birth_date: pet.birth_date,
                    owner_id: pet.owner_id,
                    owner_name: pet.owner_name
                };

                // Відправляємо PUT запит
                const putResponse = await fetch(`/api/pets/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedPet)
                });
                
                if (!putResponse.ok) {
                    const body = await putResponse.json().catch(() => null);
                    throw new Error(body?.error || 'Помилка при оновленні пацієнта');
                }
                
                showMessage('Пацієнт успішно оновлен!', 'success');
                loadPets();
            } catch (error) {
                showMessage(`Помилка: ${error.message}`, 'error');
            }
        }

        async function deletePet(id) {
            if (!confirm('Ви впевнені, що хочете видалити цього пацієнта?')) return;

            try {
                const response = await fetch(`/api/pets/${id}`, { method: 'DELETE' });
                
                if (!response.ok) throw new Error('Помилка при видаленні пацієнта');
                
                showMessage('Пацієнт успішно видалений!', 'success');
                loadPets();
            } catch (error) {
                showMessage(`Помилка: ${error.message}`, 'error');
            }
        }

        // Завантажити пацієнтів при завантаженні сторінки
        window.addEventListener('load', loadPets);
    </script>
</body>
</html>
